{% extends "base.html" %}

{% block title %}Sohbet · {{ grup.ad }}{% endblock %}

{% block content %}

<section class="sohbet" id="sohbet">
  <header class="sohbet-ust">
    <a class="sohbet-geri" href="{{ url_for('grup', grup_id=grup.id) }}" aria-label="{{ grup.ad }} grubuna dön">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="sohbet-baslik">
      <h1>{{ grup.ad }}</h1>
      <p>{{ uye_sayisi }} üye · Sohbet</p>
    </div>
  </header>

  <div class="liste-kap">
    <div id="mesajListesi" class="mesaj-listesi" aria-live="polite">
      <div id="bosMesaj" class="sohbet-bos" {% if mesajlar %}hidden{% endif %}>
        <strong>Henüz mesaj yok.</strong>Maç yorumunu ilk sen yaz. Bir mesajı yanıtlamak için sağa kaydır.
      </div>
    </div>
    <button type="button" id="yeniMesajBtn" class="yeni-mesaj-btn" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      <span id="yeniMesajSayi">Yeni mesaj</span>
    </button>
  </div>

  <div class="sohbet-alt">
    <div id="yanitCubugu" class="yanit-cubugu" hidden>
      <div class="yanit-cubugu-ic">
        <span class="yanit-cubugu-baslik">Yanıtlanıyor: <b id="yanitKime"></b></span>
        <span id="yanitOnizleme" class="yanit-cubugu-metin"></span>
      </div>
      <button type="button" id="yanitIptal" class="yanit-iptal" aria-label="Yanıtı iptal et">×</button>
    </div>
    <ul id="etiketOneri" class="etiket-oneri" role="listbox" aria-label="Kişi etiketle" hidden></ul>
    <p id="sohbetHata" class="sohbet-hata" role="alert" hidden></p>
    <form id="mesajFormu" class="mesaj-formu" autocomplete="off">
      <textarea id="mesajKutusu" rows="1" maxlength="{{ max_uzunluk }}" enterkeyhint="send"
                placeholder="Mesaj yaz, @ ile etiketle" aria-label="Mesaj"></textarea>
      <button type="submit" class="gonder-btn" id="gonderBtn" aria-label="Gönder" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13"/><path d="m13 6 6 6-6 6"/></svg>
      </button>
    </form>
  </div>
</section>

<style>
/* ---------- Kabuk ---------- */
.sohbet{position:relative; display:flex; flex-direction:column; background:var(--kart); border:1px solid var(--cizgi);
  border-radius:var(--r-buyuk); overflow:hidden; height:min(78vh, 760px)}
.sohbet-ust{flex:none; display:flex; align-items:center; gap:6px; padding:8px 12px 8px 6px; background:#fff; border-bottom:1px solid var(--cizgi)}
.sohbet-geri{flex:none; width:40px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:50%; color:var(--murekkep)}
.sohbet-geri:hover{background:var(--zemin); color:var(--murekkep)}
.sohbet-geri svg{width:24px; height:24px}
.sohbet-baslik{min-width:0}
.sohbet-baslik h1{font-size:20px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sohbet-baslik p{margin:0; font-size:13px; color:var(--gri)}
.liste-kap{position:relative; flex:1; min-height:0; display:flex}
.mesaj-listesi{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column; gap:6px; padding:12px 14px 14px; background:var(--zemin)}
.sohbet-alt{flex:none; background:#fff; border-top:1px solid var(--cizgi)}

/* Telefonda sohbet tam ekran bir uygulama gibi: üst çubuk ile alt menü arasını doldurur */
body.sohbet-sayfasi .altbilgi{display:none}
@media (max-width:640px){
  body.sohbet-sayfasi{padding-bottom:0; overflow:hidden; overscroll-behavior:none}
  body.sohbet-sayfasi main.sayfa{padding:0}
  .sohbet{position:fixed; left:0; right:0; top:56px; bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    height:auto; border:0; border-radius:0; z-index:15}
  /* Klavye açıkken alt menüyü gizle; JS kabuğu görünen alana oturtur */
  body.klavye .tabbar{display:none}
  body.klavye .sohbet{top:0; bottom:auto; z-index:30}
  body.klavye .sohbet-ust{padding-top:max(8px, env(safe-area-inset-top))}
  .mesaj-listesi{padding:10px 10px 12px}
  .mesaj{max-width:86%}
}

/* ---------- Mesajlar ---------- */
.sohbet-bos{margin:auto; color:var(--gri); text-align:center; font-size:15px; padding:0 20px}
.sohbet-bos strong{display:block; color:var(--murekkep)}
.gun-ayrac{align-self:center; margin:10px 0 4px; padding:3px 12px; border-radius:999px; background:#fff; border:1px solid var(--cizgi);
  font-size:12.5px; font-weight:600; color:var(--gri); position:sticky; top:0; z-index:2}
.mesaj{max-width:80%; padding:7px 11px 6px; border-radius:16px 16px 16px 4px; background:#fff; border:1px solid var(--cizgi);
  align-self:flex-start; overflow-wrap:anywhere}
.mesaj.benim{align-self:flex-end; background:var(--cim); color:#fff; border-color:var(--cim); border-radius:16px 16px 4px 16px}
.mesaj.devam{margin-top:-3px}
.mesaj.devam:not(.benim){border-top-left-radius:6px}
.mesaj.devam.benim{border-top-right-radius:6px}
.mesaj.devam .mesaj-ad{display:none}
.mesaj-ust{display:flex; gap:8px; align-items:baseline; font-size:12.5px}
.mesaj-ust:empty{display:none}
.mesaj-ad{font-weight:700; color:var(--cim)}
.mesaj.benim .mesaj-ad{display:none}
.mesaj-icerik{white-space:pre-wrap; font-size:16px; line-height:1.35; overflow-wrap:anywhere}
.mesaj-link{color:inherit; text-decoration:underline; text-underline-offset:2px; font-weight:600; word-break:break-all}
.yt-kart{display:block; position:relative; width:min(280px, 62vw); aspect-ratio:16/9; margin:6px 0 2px; padding:0; border:0; border-radius:10px; overflow:hidden; background:#000; cursor:pointer}
.yt-kart img{width:100%; height:100%; object-fit:cover; display:block}
.yt-oyna{position:absolute; left:50%; top:50%; width:56px; height:40px; margin:-20px 0 0 -28px; border-radius:12px; background:rgba(230,33,23,.92)}
.yt-oyna::after{content:""; position:absolute; left:23px; top:12px; border-style:solid; border-width:8px 0 8px 14px; border-color:transparent transparent transparent #fff}
iframe.yt-oynuyor{cursor:auto}
.mesaj-alt{display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-top:1px; font-size:11.5px; line-height:1.2}
.mesaj-saat{color:var(--gri-acik)}
.mesaj.benim .mesaj-saat{color:rgba(255,255,255,.8)}
.mesaj-sil, .mesaj-yanitla{background:none; border:0; padding:0 2px; cursor:pointer; color:inherit; opacity:.6; font:600 12px/1.2 var(--yazi)}
.mesaj-sil:hover, .mesaj-yanitla:hover{opacity:1}
/* Sağa kaydırarak yanıtla */
.mesaj{position:relative; touch-action:pan-y; transition:transform .2s ease; -webkit-touch-callout:none}
.mesaj.surukleniyor{transition:none; user-select:none; -webkit-user-select:none}
.mesaj .kaydir-ikon{position:absolute; left:-34px; top:50%; width:26px; height:26px; margin-top:-13px; border-radius:50%;
  background:var(--cim); color:#fff; display:flex; align-items:center; justify-content:center; opacity:0; transform:scale(.6);
  transition:opacity .1s, transform .1s; pointer-events:none}
.mesaj .kaydir-ikon svg{width:15px; height:15px}
.mesaj.esik .kaydir-ikon{transform:scale(1)}
/* Dokunmatikte "Yanıtla/Sil" düğmeleri mesaja dokununca açılır; farede üstüne gelince */
@media (hover:none){ .mesaj .mesaj-eylem{display:none} .mesaj.secili .mesaj-eylem{display:inline-block} .mesaj.secili{box-shadow:0 0 0 2px var(--cim-acik)} }
@media (hover:hover){ .mesaj .mesaj-eylem{opacity:0} .mesaj:hover .mesaj-eylem, .mesaj-eylem:focus-visible{opacity:.7} }
.alinti{display:block; width:100%; text-align:left; margin:3px 0 5px; padding:5px 9px; border:0; border-left:3px solid var(--cim);
  background:var(--cim-acik); border-radius:6px; font:inherit; font-size:13.5px; line-height:1.3; color:var(--murekkep); cursor:pointer}
.alinti b{display:block; font-size:12.5px; color:var(--cim-koyu)}
.alinti span{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:240px; color:var(--gri)}
.mesaj.benim .alinti{background:rgba(255,255,255,.16); border-left-color:#fff; color:#fff}
.mesaj.benim .alinti b{color:#fff}
.mesaj.benim .alinti span{color:rgba(255,255,255,.85)}
.mesaj.vurgu{box-shadow:0 0 0 3px var(--sari)}
.kisi{font-weight:700; color:var(--cim-koyu); background:var(--cim-acik); border-radius:4px; padding:0 3px}
.kisi.ben{background:var(--sari-acik); color:#6E5300}
.mesaj.benim .kisi{background:rgba(255,255,255,.2); color:#fff}
.mesaj.beni-etiketledi{border-color:var(--sari); box-shadow:inset 3px 0 0 var(--sari)}

/* Yukarıdayken gelen mesaj için "aşağı in" düğmesi */
.yeni-mesaj-btn{position:absolute; right:12px; bottom:12px; display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 14px 0 10px;
  border:0; border-radius:999px; background:var(--murekkep); color:#fff; font:600 14px/1 var(--yazi); cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.18); z-index:3}
.yeni-mesaj-btn[hidden]{display:none}
.yeni-mesaj-btn svg{width:18px; height:18px}

/* ---------- Yazma alanı ---------- */
.mesaj-formu{display:flex; gap:8px; padding:8px 10px; align-items:flex-end}
@media (max-width:640px){ body.klavye .mesaj-formu{padding-bottom:max(8px, env(safe-area-inset-bottom))} }
.mesaj-formu textarea{flex:1; resize:none; margin:0; min-height:44px; max-height:132px; padding:10px 14px; border-radius:22px; font-size:16px; line-height:1.4}
.gonder-btn{flex:none; width:44px; height:44px; border:0; border-radius:50%; background:var(--cim); color:#fff; display:flex;
  align-items:center; justify-content:center; cursor:pointer; transition:background .15s, opacity .15s}
.gonder-btn svg{width:22px; height:22px}
.gonder-btn:disabled{background:var(--cizgi-koyu); cursor:default}
.yanit-cubugu{display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--cim-acik); border-left:3px solid var(--cim)}
.yanit-cubugu[hidden]{display:none}
.yanit-cubugu-ic{flex:1; min-width:0; font-size:13.5px}
.yanit-cubugu-baslik{display:block; color:var(--cim-koyu)}
.yanit-cubugu-metin{display:block; color:var(--gri); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.yanit-iptal{flex:none; width:36px; height:36px; border:0; border-radius:50%; background:#fff; color:var(--gri); font-size:22px; line-height:1; cursor:pointer}
.etiket-oneri{list-style:none; margin:0; padding:4px; border-bottom:1px solid var(--cizgi); background:#fff; max-height:200px; overflow-y:auto}
.etiket-oneri[hidden]{display:none}
.etiket-oneri li{padding:11px 12px; border-radius:8px; cursor:pointer; font-weight:600; display:flex; gap:8px; align-items:center}
.etiket-oneri li small{font-weight:400; color:var(--gri)}
.etiket-oneri li[aria-selected="true"], .etiket-oneri li:hover{background:var(--cim-acik); color:var(--cim-koyu)}
.sohbet-hata{color:var(--kirmizi); font-size:14px; margin:0; padding:8px 14px 0}
.sohbet-hata[hidden]{display:none}
</style>

<script>
(function(){
  var GRUP = {{ grup.id }};
  var BEN = {{ current_user.id }};
  var UYELER = {{ uyeler | tojson }};
  var BENIM_ADIM = (UYELER.find(function(u){ return u.id === BEN; }) || {}).ad || '';
  var ETIKETLER = UYELER.map(function(u){ return u.ad; }).concat(['herkes'])
                        .sort(function(a, b){ return b.length - a.length; });
  function kucuk(t){ return (t || '').toLocaleLowerCase('tr'); }
  // Metni güvenli şekilde DOM'a çevirir; @Ad etiketlerini vurgular. Beni etiketlediyse true döner.
  // Bağlantılar: http(s):// ya da www. ile başlayan adresler tıklanabilir olur.
  var URL_RE = /(?:https?:\/\/|www\.|youtu\.be\/|(?:m\.)?youtube\.com\/)[^\s<>"']*/gi;
  function urlTemizle(u){
    var son = '';
    while (/[.,!?;:)\]'"»]$/.test(u)) {
      if (u.slice(-1) === ')' && (u.match(/\(/g) || []).length >= (u.match(/\)/g) || []).length) break;
      son = u.slice(-1) + son; u = u.slice(0, -1);
    }
    return [u, son];
  }
  function youtubeId(u){
    var m = u.match(/(?:youtube\.com\/(?:watch\?(?:[^#\s]*&)?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/i);
    return m ? m[1] : null;
  }
  function icerikYaz(el, metin){
    var son = 0, beni = false, m, videolar = [];
    URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(metin)) !== null) {
      var t = urlTemizle(m[0]), adres = t[0];
      if (!adres) continue;
      if (m.index > son && etiketYaz(el, metin.slice(son, m.index))) beni = true;
      var href = /^https?:\/\//i.test(adres) ? adres : 'https://' + adres;
      var a = document.createElement('a');
      a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow ugc'; a.className = 'mesaj-link';
      a.textContent = adres;
      el.appendChild(a);
      son = m.index + adres.length;
      URL_RE.lastIndex = son;
      var vid = youtubeId(href);
      if (vid && videolar.indexOf(vid) < 0) videolar.push(vid);
    }
    if (son < metin.length && etiketYaz(el, metin.slice(son))) beni = true;
    videolar.slice(0, 2).forEach(function(vid){ el.appendChild(youtubeKarti(vid)); });
    return beni;
  }
  // YouTube önizlemesi: küçük resim + oynat düğmesi; dokununca sohbetin içinde oynar.
  function youtubeKarti(vid){
    var k = document.createElement('button'); k.type = 'button'; k.className = 'yt-kart';
    k.setAttribute('aria-label', 'YouTube videosunu oynat');
    var img = document.createElement('img'); img.loading = 'lazy'; img.alt = '';
    img.src = 'https://i.ytimg.com/vi/' + vid + '/hqdefault.jpg';
    img.onerror = function(){ img.style.visibility = 'hidden'; };
    var oyna = document.createElement('span'); oyna.className = 'yt-oyna'; oyna.setAttribute('aria-hidden', 'true');
    k.appendChild(img); k.appendChild(oyna);
    k.addEventListener('click', function(e){
      e.stopPropagation();
      var f = document.createElement('iframe');
      f.src = 'https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&playsinline=1';
      f.className = 'yt-kart yt-oynuyor'; f.title = 'YouTube videosu';
      f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen = true;
      k.replaceWith(f);
    });
    return k;
  }
  function etiketYaz(el, metin){
    var i = 0, son = 0, beni = false, km = kucuk(metin);
    while ((i = metin.indexOf('@', i)) !== -1) {
      var bulunan = null;
      for (var k = 0; k < ETIKETLER.length; k++) {
        var ad = ETIKETLER[k], bitis = i + 1 + ad.length;
        if (km.substr(i + 1, ad.length) === kucuk(ad) && !/[\p{L}\p{N}_]/u.test(metin.charAt(bitis) || ' ')) { bulunan = ad; break; }
      }
      if (!bulunan) { i++; continue; }
      if (i > son) el.appendChild(document.createTextNode(metin.slice(son, i)));
      var sp = document.createElement('span');
      var benMi = bulunan === 'herkes' || kucuk(bulunan) === kucuk(BENIM_ADIM);
      sp.className = 'kisi' + (benMi ? ' ben' : '');
      sp.textContent = metin.substr(i, bulunan.length + 1);
      el.appendChild(sp);
      if (benMi) beni = true;
      i += bulunan.length + 1; son = i;
    }
    if (son < metin.length) el.appendChild(document.createTextNode(metin.slice(son)));
    return beni;
  }
  var YETKILI = {{ 'true' if (current_user.admin or grup.kurucu_id == current_user.id) else 'false' }};
  var liste = document.getElementById('mesajListesi');
  var bos = document.getElementById('bosMesaj');
  var form = document.getElementById('mesajFormu');
  var kutu = document.getElementById('mesajKutusu');
  var btn = document.getElementById('gonderBtn');
  var hata = document.getElementById('sohbetHata');
  var sonId = 0;
  var gorulen = {};

  function altaYakinMi(){ return liste.scrollHeight - liste.scrollTop - liste.clientHeight < 80; }
  function altaKaydir(){ liste.scrollTop = liste.scrollHeight; }

  // Gün ayracı ve art arda mesaj gruplama için son eklenen mesajın bilgisi
  var son = {gun: null, kid: null, ts: 0};
  function bugunTR(farkGun){
    var d = new Date(Date.now() + 3 * 3600 * 1000 - (farkGun || 0) * 86400000);
    return d.toISOString().slice(0, 10);
  }
  var AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  function gunEtiketi(g){
    if (g === bugunTR(0)) return 'Bugün';
    if (g === bugunTR(1)) return 'Dün';
    var p = g.split('-');
    var etiket = (+p[2]) + ' ' + AYLAR[+p[1] - 1];
    return p[0] === bugunTR(0).slice(0, 4) ? etiket : etiket + ' ' + p[0];
  }

  function mesajEkle(m){
    if (gorulen[m.id]) return;
    gorulen[m.id] = true;
    sonId = Math.max(sonId, m.id);
    bos.hidden = true;

    if (m.gun && m.gun !== son.gun) {
      var ay = document.createElement('div'); ay.className = 'gun-ayrac'; ay.textContent = gunEtiketi(m.gun);
      liste.appendChild(ay);
      son.kid = null;
    }
    var devam = son.kid === m.kullanici_id && m.ts && son.ts && (m.ts - son.ts) < 300;
    son.gun = m.gun || son.gun; son.kid = m.kullanici_id; son.ts = m.ts || 0;

    var d = document.createElement('div');
    d.className = 'mesaj' + (m.kullanici_id === BEN ? ' benim' : '') + (devam ? ' devam' : '');
    d.dataset.id = m.id;

    var ust = document.createElement('div'); ust.className = 'mesaj-ust';
    if (m.kullanici_id !== BEN) {
      var ad = document.createElement('span'); ad.className = 'mesaj-ad'; ad.textContent = m.kullanici_adi;
      ust.appendChild(ad);
    }
    d.appendChild(ust);
    if (m.yanit) {
      var al = document.createElement('button'); al.type = 'button'; al.className = 'alinti';
      var ab = document.createElement('b'); ab.textContent = m.yanit.kullanici_adi || '';
      var am = document.createElement('span'); am.textContent = m.yanit.icerik;
      al.appendChild(ab); al.appendChild(am);
      al.addEventListener('click', function(){ mesajaGit(m.yanit.id); });
      d.appendChild(al);
    }
    var ic = document.createElement('div'); ic.className = 'mesaj-icerik';
    if (icerikYaz(ic, m.icerik) && m.kullanici_id !== BEN) d.classList.add('beni-etiketledi');
    d.appendChild(ic);

    var alt = document.createElement('div'); alt.className = 'mesaj-alt';
    var yan = document.createElement('button'); yan.type = 'button'; yan.className = 'mesaj-yanitla mesaj-eylem';
    yan.textContent = 'Yanıtla'; yan.setAttribute('aria-label', m.kullanici_adi + ' mesajını yanıtla');
    yan.addEventListener('click', function(){ seciliKaldir(); yanitBaslat(m); });
    alt.appendChild(yan);
    if (m.kullanici_id === BEN || YETKILI) {
      var sil = document.createElement('button'); sil.type = 'button'; sil.className = 'mesaj-sil mesaj-eylem';
      sil.title = 'Mesajı sil'; sil.setAttribute('aria-label','Mesajı sil'); sil.textContent = 'Sil';
      sil.addEventListener('click', function(){ if (confirm('Bu mesaj silinsin mi?')) mesajSil(m.id, d); });
      alt.appendChild(sil);
    }
    var saat = document.createElement('span'); saat.className = 'mesaj-saat'; saat.textContent = m.hm || m.saat;
    saat.title = m.saat;
    alt.appendChild(saat);
    d.appendChild(alt);

    var ikon = document.createElement('span'); ikon.className = 'kaydir-ikon'; ikon.setAttribute('aria-hidden', 'true');
    ikon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v3"/></svg>';
    d.appendChild(ikon);
    // Dokunmatikte mesaja dokununca Yanıtla/Sil görünür
    d.addEventListener('click', function(e){
      if (e.target.closest('button, a, iframe') || d.dataset.yeniSuruklendi) return;
      var acik = d.classList.contains('secili');
      seciliKaldir();
      if (!acik) d.classList.add('secili');
    });
    kaydirmaBagla(d, m);
    liste.appendChild(d);
  }
  function seciliKaldir(){ liste.querySelectorAll('.mesaj.secili').forEach(function(x){ x.classList.remove('secili'); }); }

  // Mesajı sağa kaydırınca yanıtla (dokunmatik ve fare sürükleme)
  var KAYDIR_ESIK = 56, KAYDIR_MAKS = 84;
  function kaydirmaBagla(el, m){
    var basX = 0, basY = 0, dx = 0, durum = null, pid = null;
    el.addEventListener('pointerdown', function(e){
      if (e.button > 0 || e.target.closest('button')) return;
      basX = e.clientX; basY = e.clientY; dx = 0; durum = 'bekle'; pid = e.pointerId;
    });
    el.addEventListener('pointermove', function(e){
      if (!durum || e.pointerId !== pid) return;
      var x = e.clientX - basX, y = e.clientY - basY;
      if (durum === 'bekle') {
        if (Math.abs(y) > 10 && Math.abs(y) > Math.abs(x)) { durum = null; return; }   // dikey kaydırma: sayfayı kaydır
        if (x > 10 && x > Math.abs(y)) {
          durum = 'yatay'; el.classList.add('surukleniyor');
          try { el.setPointerCapture(pid); } catch (err) {}
        } else return;
      }
      dx = Math.max(0, Math.min(KAYDIR_MAKS, x));
      el.style.transform = 'translateX(' + dx + 'px)';
      var ikon = el.querySelector('.kaydir-ikon');
      if (ikon) ikon.style.opacity = Math.min(1, dx / KAYDIR_ESIK);
      var gecti = dx >= KAYDIR_ESIK;
      if (gecti && !el.classList.contains('esik') && navigator.vibrate) { try { navigator.vibrate(12); } catch (err) {} }
      el.classList.toggle('esik', gecti);
      e.preventDefault();
    });
    function bitir(){
      if (durum === 'yatay') {
        if (dx >= KAYDIR_ESIK) yanitBaslat(m);
        el.dataset.yeniSuruklendi = '1';
        setTimeout(function(){ delete el.dataset.yeniSuruklendi; }, 350);
      }
      durum = null; dx = 0;
      el.classList.remove('surukleniyor', 'esik');
      el.style.transform = '';
      var ikon = el.querySelector('.kaydir-ikon'); if (ikon) ikon.style.opacity = '';
    }
    el.addEventListener('pointerup', bitir);
    el.addEventListener('pointercancel', bitir);
    // Sürükleme sonrası oluşan tıklama, alıntıya/düğmeye basılmış sayılmasın
    el.addEventListener('click', function(e){ if (el.dataset.yeniSuruklendi) { e.stopPropagation(); e.preventDefault(); } }, true);
  }

  var yanitCubugu = document.getElementById('yanitCubugu');
  var yanitKime = document.getElementById('yanitKime');
  var yanitOnizleme = document.getElementById('yanitOnizleme');
  var yanitId = null;
  function yanitBaslat(m){
    yanitId = m.id;
    yanitKime.textContent = m.kullanici_id === BEN ? 'kendi mesajın' : m.kullanici_adi;
    yanitOnizleme.textContent = m.icerik;
    yanitCubugu.hidden = false;
    kutu.focus();
  }
  function yanitBitir(){ yanitId = null; yanitCubugu.hidden = true; }
  document.getElementById('yanitIptal').addEventListener('click', yanitBitir);
  function mesajaGit(id){
    var el = liste.querySelector('.mesaj[data-id="' + id + '"]');
    if (!el) return;
    el.scrollIntoView({behavior: 'smooth', block: 'center'});
    el.classList.add('vurgu'); setTimeout(function(){ el.classList.remove('vurgu'); }, 1400);
  }
  kutu.addEventListener('keydown', function(e){ if (e.key === 'Escape' && yanitId && !oneriAcik()) yanitBitir(); });

  function hataGoster(t){ hata.textContent = t; hata.hidden = !t; }

  function mesajSil(id, el){
    fetch('/grup/' + GRUP + '/sohbet/sil/' + id, {method:'POST', credentials:'same-origin'})
      .then(function(r){ if (r.ok) { el.remove(); bos.hidden = !!liste.querySelector('.mesaj'); } });
  }

  function yenile(){
    fetch('/grup/' + GRUP + '/sohbet/mesajlar?sonra=' + sonId, {credentials:'same-origin'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(v){
        if (!v) return;
        var asagida = altaYakinMi();
        v.mesajlar.forEach(mesajEkle);
        // Başkasının sildiği mesajları kaldır
        var mevcut = {}; v.mevcut_idler.forEach(function(i){ mevcut[i] = true; });
        var enEski = v.mevcut_idler.length ? Math.min.apply(null, v.mevcut_idler) : Infinity;
        liste.querySelectorAll('.mesaj').forEach(function(el){
          var id = +el.dataset.id;
          if (id >= enEski && !mevcut[id]) el.remove();
        });
        bos.hidden = !!liste.querySelector('.mesaj');
        if (v.mesajlar.length) {
          if (asagida) altaKaydir();
          else { bekleyen += v.mesajlar.filter(function(x){ return x.kullanici_id !== BEN; }).length; yeniBtnGuncelle(); }
        }
      })
      .catch(function(){});
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var icerik = kutu.value.trim();
    if (!icerik) return;
    btn.disabled = true; hataGoster('');
    fetch('/grup/' + GRUP + '/sohbet/gonder', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({icerik: icerik, yanit_id: yanitId})
    }).then(function(r){ return r.json().then(function(v){ return {ok:r.ok, v:v}; }); })
      .then(function(s){
        if (!s.ok) { hataGoster(s.v.hata || 'Mesaj gönderilemedi.'); return; }
        kutu.value = ''; boyutla(); yanitBitir();
        mesajEkle(s.v.mesaj); altaKaydir();
      })
      .catch(function(){ hataGoster('Bağlantı hatası, tekrar dene.'); })
      .finally(function(){ btn.disabled = !kutu.value.trim(); kutu.focus(); });
  });

  // Enter = gönder, Shift+Enter = yeni satır
  kutu.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey && !oneriAcik() && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });
  function boyutla(){
    kutu.style.height = 'auto'; kutu.style.height = Math.min(kutu.scrollHeight, 132) + 'px';
    btn.disabled = !kutu.value.trim();
  }
  kutu.addEventListener('input', boyutla);
  // Gönder'e basınca kutu odağı kaybetmesin: telefonda klavye kapanıp açılmasın
  btn.addEventListener('pointerdown', function(e){ e.preventDefault(); });
  btn.addEventListener('mousedown', function(e){ e.preventDefault(); });

  // ---- Yukarıdayken gelen yeni mesajlar
  var yeniBtn = document.getElementById('yeniMesajBtn');
  var yeniSayi = document.getElementById('yeniMesajSayi');
  var bekleyen = 0;
  function yeniBtnGuncelle(){
    yeniBtn.hidden = bekleyen === 0;
    yeniSayi.textContent = bekleyen === 1 ? '1 yeni mesaj' : bekleyen + ' yeni mesaj';
  }
  yeniBtn.addEventListener('click', function(){ liste.scrollTo({top: liste.scrollHeight, behavior: 'smooth'}); });
  liste.addEventListener('scroll', function(){ if (bekleyen && altaYakinMi()) { bekleyen = 0; yeniBtnGuncelle(); } }, {passive: true});

  // ---- Telefonda klavye: kabuğu görünen alana oturt, alt menüyü gizle
  var kabuk = document.getElementById('sohbet');
  var mobil = window.matchMedia('(max-width:640px)');
  var vv = window.visualViewport;
  function kabukOturt(){
    if (!document.body.classList.contains('klavye') || !vv) return;
    kabuk.style.top = vv.offsetTop + 'px';
    kabuk.style.height = vv.height + 'px';
  }
  function klavyeAc(){
    if (!mobil.matches) return;
    var asagida = altaYakinMi();
    document.body.classList.add('klavye');
    kabukOturt();
    if (asagida) setTimeout(altaKaydir, 60);
  }
  function klavyeKapat(){
    document.body.classList.remove('klavye');
    kabuk.style.top = ''; kabuk.style.height = '';
  }
  kutu.addEventListener('focus', klavyeAc);
  kutu.addEventListener('blur', function(){ setTimeout(function(){ if (document.activeElement !== kutu) klavyeKapat(); }, 120); });
  if (vv) {
    vv.addEventListener('resize', function(){ var a = altaYakinMi(); kabukOturt(); if (a) altaKaydir(); });
    vv.addEventListener('scroll', kabukOturt);
  }

  // ---- @ etiketleme önerileri
  var oneri = document.getElementById('etiketOneri');
  var oneriSecili = 0, oneriBaslangic = -1, oneriListe = [];
  function oneriAcik(){ return !oneri.hidden; }
  function oneriKapat(){ oneri.hidden = true; oneriBaslangic = -1; }
  function oneriCiz(){
    oneri.innerHTML = '';
    oneriListe.forEach(function(o, idx){
      var li = document.createElement('li'); li.setAttribute('role', 'option');
      li.setAttribute('aria-selected', idx === oneriSecili ? 'true' : 'false');
      li.textContent = '@' + o.ad;
      if (o.herkes) { var sm = document.createElement('small'); sm.textContent = 'gruptaki herkes'; li.appendChild(sm); }
      li.addEventListener('mousedown', function(e){ e.preventDefault(); oneriUygula(idx); });
      oneri.appendChild(li);
    });
    oneri.hidden = oneriListe.length === 0;
  }
  function oneriGuncelle(){
    var imlec = kutu.selectionStart, onceki = kutu.value.slice(0, imlec);
    var at = onceki.lastIndexOf('@');
    if (at === -1 || (at > 0 && /\S/.test(onceki.charAt(at - 1))) ) { oneriKapat(); return; }
    var sorgu = onceki.slice(at + 1);
    if (sorgu.length > 25 || /\n/.test(sorgu)) { oneriKapat(); return; }
    var q = kucuk(sorgu);
    var adaylar = UYELER.filter(function(u){ return u.id !== BEN; }).map(function(u){ return {ad: u.ad}; });
    adaylar.push({ad: 'herkes', herkes: true});
    oneriListe = adaylar.filter(function(u){ return kucuk(u.ad).indexOf(q) === 0 || (q.length > 1 && kucuk(u.ad).indexOf(q) > 0); }).slice(0, 6);
    oneriBaslangic = at; oneriSecili = 0; oneriCiz();
  }
  function oneriUygula(idx){
    var o = oneriListe[idx]; if (!o) return;
    var imlec = kutu.selectionStart;
    var yeni = kutu.value.slice(0, oneriBaslangic) + '@' + o.ad + ' ';
    kutu.value = yeni + kutu.value.slice(imlec);
    kutu.setSelectionRange(yeni.length, yeni.length);
    oneriKapat(); kutu.focus();
  }
  kutu.addEventListener('input', oneriGuncelle);
  kutu.addEventListener('click', oneriGuncelle);
  kutu.addEventListener('blur', function(){ setTimeout(oneriKapat, 150); });
  kutu.addEventListener('keydown', function(e){
    if (!oneriAcik()) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); oneriSecili = (oneriSecili + 1) % oneriListe.length; oneriCiz(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); oneriSecili = (oneriSecili - 1 + oneriListe.length) % oneriListe.length; oneriCiz(); }
    else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); oneriUygula(oneriSecili); }
    else if (e.key === 'Escape') { e.preventDefault(); oneriKapat(); }
  });

  {{ mesajlar | tojson }}.forEach(mesajEkle);
  altaKaydir();

  // Sekme açıkken 8 sn'de bir yeni mesajlara bak; sekme arka plandayken sunucuyu hiç yorma
  function dongu(){ if (!document.hidden) yenile(); setTimeout(dongu, 8000); }
  setTimeout(dongu, 8000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) yenile(); });
})();
</script>

{% endblock %}
